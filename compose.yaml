name: sabitech

services:
  # 1) Backend: PHP + Apache (se construye con el dockerfile de esta carpeta)
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      # Nombres que lee Laravel (config/database.php)
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      # Correo de laboratorio: Mailpit (bandeja en http://localhost:8025)
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    volumes:
      - ./app:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  # 2) Base de datos: MySQL
  db:
    image: mysql:8.4
    # Permite que las migraciones de Laravel creen triggers con un usuario normal
    # (sin esto MySQL da el error 1419 porque el log binario está activado)
    command: --log-bin-trust-function-creators=1
    ports:
      # Solo para MySQL Workbench desde tu PC. Si Windows da error con el puerto 3307,
      # pon otro en tu .env, por ejemplo MYSQL_HOST_PORT=3310
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      # Scripts que se ejecutan al crear el volumen (crea la base de datos de pruebas)
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Comprueba que MySQL ya está listo antes de arrancar la web
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      retries: 20

  # 3) phpMyAdmin: ver la base de datos en el navegador
  phpmyadmin:
    image: phpmyadmin:5
    environment:
      PMA_HOST: db
    ports:
      - "8081:80"
    depends_on:
      - db

  # 4) Mailpit: buzón de laboratorio para ver los correos de confirmación
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"   # interfaz web
      - "1025:1025"   # SMTP

  # 5) Frontend: React + Vite (servidor de desarrollo)
  frontend:
    image: node:22-alpine
    working_dir: /app
    # Instala las dependencias (solo tarda la primera vez) y arranca Vite.
    # --host 0.0.0.0 hace que se pueda abrir desde el navegador del ordenador.
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      # En Windows los cambios en los ficheros no llegan bien al contenedor:
      # así Vite los detecta y recarga la página al guardar.
      VITE_USE_POLLING: "true"
    volumes:
      - ./frontend:/app
      # node_modules se queda dentro de Docker (los de Windows no sirven en Linux)
      - frontend_node_modules:/app/node_modules
    depends_on:
      - web

volumes:
  mysql_data:
  frontend_node_modules:
