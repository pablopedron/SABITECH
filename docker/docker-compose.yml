version: '3.8'

services:
  # 1. CONTENEDOR BASE DE DATOS (MariaDB)
  database:
    image: mariadb:10.11
    container_name: sabitech_db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - sabitech_network

  # 2. CONTENEDOR BACKEND (PHP-FPM)
  backend:
    image: php:8.2-fpm
    container_name: sabitech_backend
    restart: always
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    networks:
      - sabitech_network
    depends_on:
      - database

  # 3. CONTENEDOR FRONTEND (Nginx)
  frontend:
    image: nginx:alpine
    container_name: sabitech_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    networks:
      - sabitech_network

# Red interna para comunicar los contenedores
networks:
  sabitech_network:
    driver: bridge

# Volumen persistente para que los datos de MySQL no se borren al apagar Docker
volumes:
  db_data:
    driver: local